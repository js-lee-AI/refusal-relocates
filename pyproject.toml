[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-relocates"
dynamic = ["version"]
description = "Refusal localization, layer freezing and weight-space repair under few-sample fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["llm-safety", "fine-tuning", "refusal", "activation-patching", "lora"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The spectral core, the refusal scorers and the data selection run on numpy alone,
# so `import refusal` works on any laptop. Torch comes in with the models extra
# and loads on first use.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "transformers>=4.57,<5",
    "peft>=0.18",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "scikit-learn>=1.3",
    "datasets>=2.19",
]
test = ["pytest>=8"]

[project.scripts]
refusal = "refusal.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/refusal-relocates"
Issues = "https://github.com/js-lee-AI/refusal-relocates/issues"

[tool.setuptools.dynamic]
version = { attr = "refusal.__version__" }

[tool.setuptools.packages.find]
include = ["refusal*"]

[tool.setuptools.package-data]
refusal = ["selection.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and the models extra"]
addopts = "-m 'not gpu'"
